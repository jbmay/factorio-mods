name: Check mods

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.mods.outputs.mods }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-maru
      - id: mods
        name: Discover mods
        run: |
          maru run list-mods
          echo "mods=$(cat dist/mods.json)" >> "$GITHUB_OUTPUT"

  mods:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJSON(needs.discover.outputs.mods) }}
    uses: ./.github/workflows/test-mod.yml
    with:
      mod: ${{ matrix.mod }}
      ref: ${{ github.sha }}
      # Fork PRs run syntax/package checks without receiving download credentials.
      engine: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    secrets: inherit

  checks:
    name: All mod checks
    if: always()
    needs: [discover, mods]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          DISCOVER: ${{ needs.discover.result }}
          MODS: ${{ needs.mods.result }}
        run: test "$DISCOVER" = success && test "$MODS" = success
