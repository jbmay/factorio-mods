name: Check mods

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.mods.outputs.mods }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-maru
      - id: mods
        name: Discover mods
        run: |
          maru run list-mods
          echo "mods=$(cat dist/mods.json)" >> "$GITHUB_OUTPUT"

  pr-mods:
    if: github.event_name == 'pull_request'
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJSON(needs.discover.outputs.mods) }}
    uses: ./.github/workflows/test-mod.yml
    with:
      mod: ${{ matrix.mod }}
      engine: false

  main-mods:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJSON(needs.discover.outputs.mods) }}
    uses: ./.github/workflows/test-mod.yml
    with:
      mod: ${{ matrix.mod }}
      engine: true
    secrets:
      FACTORIO_USERNAME: ${{ secrets.FACTORIO_USERNAME }}
      FACTORIO_TOKEN: ${{ secrets.FACTORIO_TOKEN }}

  checks:
    name: All mod checks
    if: always()
    needs: [discover, pr-mods, main-mods]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          DISCOVER: ${{ needs.discover.result }}
          PR_MODS: ${{ needs.pr-mods.result }}
          MAIN_MODS: ${{ needs.main-mods.result }}
        run: |
          test "$DISCOVER" = success
          case "$PR_MODS:$MAIN_MODS" in
            success:skipped|skipped:success) ;;
            *) exit 1 ;;
          esac
