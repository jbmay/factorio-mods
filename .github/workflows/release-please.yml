name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases: ${{ steps.matrix.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Require bot credentials that trigger PR checks
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo 'Configure RELEASE_PLEASE_TOKEN so release PRs trigger CI.' >&2
            exit 1
          fi
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Select released mods
        id: matrix
        env:
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: echo "releases=$(python tools/mod_ci.py release-matrix)" >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    if: needs.release.outputs.releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.releases) }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      mod: ${{ matrix.mod }}
      tag: ${{ matrix.tag }}
    secrets: inherit
