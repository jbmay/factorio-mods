[item-name]
GCKI_car-key=Keys

[shortcut-name]
GCKI_car-key-shortcut=GCKI: Keys

[shortcut-description]
#~ GCKI_car-key-shortcut=Use the keys to claim, lock/unlock or summon vehicles!\n[color=yellow](Can only be used in character mode!)[/color]
GCKI_car-key-shortcut=Click on a vehicle to claim it. Click on a claimed vehicle will lock/unlock it, clicking on the ground will summon your vehicle to that position.\nSelect an area to open a GUI for the selected vehicles. Using SHIFT while selecting will add the selected vehicles to the GUI, selecting with the right mouse button will remove them.\n[color=yellow](Keys can only be used in character mode!)[/color]


[controls]
keys-to-cursor=Spawn keys

[controls-description]
keys-to-cursor=Spawn keys (TEST)

[GCKI-commands]
command=[color=yellow]Usage: /__1__ [on, off, toggle, status]\nChanges the setting __2__. When called without an argument, it will toggle the current state.\n(__3__)[/color]
command-help=[color=yellow]Usage: /__1__ [on, off, toggle, status]\nChanges the setting __2__. When called without an argument, it will toggle the current state.[/color]
command-toggled=[color=yellow]__1__ has been turned __2__.[/color]
command-status=[color=yellow]__1__ is __2__.[/color]
command-unlock-help=[color=yellow]Usage: /__1__ [unit_number]\nWill unlock the vehicle with the specified unit_number if command was used by an admin or by the player who has locked the vehicle. If no unit_number is given, the command will unlock ALL vehicles if used by an admin, or all vehicles locked by the player who used the command.[/color]
command-unlock-player-help=[color=yellow]Usage: /__1__ [index, name]\nWill unlock all vehicles locked by the specified player. This command can only be used by admins.[/color]
command-reset-help=[color=yellow]Usage: /__1__ [unit_number]\nWill reset the vehicle with the specified unit_number if command was used by an admin or by the player who has locked or currently owns the vehicle. If no unit_number is given, the command will reset ALL vehicles if used by an admin, or all vehicles locked/owned by the player who used the command.[/color]
command-reset-player-help=[color=yellow]Usage: /__1__ [index, name]\nWill reset all vehicles locked/owned by the specified player. This command can only be used by admins.[/color]

# Debugging commands
## Moved to Pi-C_lib
#~ command-GCKI-show-active-events-help=[color=yellow]Usage: /__1__ \nPrints the names of all currently active events to the game chat and the log file.[/color]
#~ GCKI-is-event-active=[color=yellow]Usage: /__1__ [event_name, event_id]\nThis command will tell you whether GCKI is currently listening to the specified event. The event can be specified using a string for the literal event name or an integer number for the event id.[/color]
#~ GCKI-is-event-active-help=[color=yellow]Usage: /__1__ [event_name, event_id]\nThis command will tell you whether GCKI is currently listening to the specified event. The event can be specified using a string for the literal event name or an integer number for the event id.[/color]

