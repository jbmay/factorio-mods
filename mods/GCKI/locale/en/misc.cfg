#~ GCKI-is-event-active-help=[color=yellow]Usage: /__1__ [event_name, event_id]\nThis command will tell you whether GCKI is currently listening to the specified event. The event can be specified using a string for the literal event name or an integer number for the event id.[/color]

[GCKI-clear-owner]
usage=Admin recovery: /GCKI-clear-owner [selected | vehicle <unit_number> | player <name or index>]. Clears locks and claims for the selected vehicle, one ID, or one player's vehicles. Names with spaces may be quoted. Server console requires an explicit vehicle or player target.
denied=You must have administrator rights to recover vehicles.
no-player=No player named or indexed __1__ exists.
no-vehicles=No valid claimed or locked vehicles matched. Nothing changed.
success=Recovered __1__ vehicle(s). Their locks and claims were cleared; contents, equipment, names and colors were preserved.

[GCKI-command-errors]
error=[color=yellow][ERROR] __1__[/color]
must-be-admin=You must have administrator rights to use this command!
no-such-player=There is no player "__1__"!
no-such-vehicle=There is no vehicle with unit_number __1__!
no-locked-or-owned-vehicles=There are no vehicles you could unlock or reset!
player-has-no-vehicles=Nothing to do: Player "__1__" has not claimed or locked any vehicles!
