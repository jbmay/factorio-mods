[string-mod-setting]
GCKI-select_orientation_from-player=Player
GCKI-select_orientation_from-vehicle=Vehicle

[string-mod-setting-description]
GCKI-select_orientation_from-player=Summoned vehicles will only get their orientation from players who have a character! If you are in a vehicle supported by GCKI, summoned vehicles will rotate to that vehicle's orientation. If you are inside the summoned vehicle or in a vehicle not supported by GCKI, the summoned vehicle will keep its current orientation.
GCKI-select_orientation_from-vehicle=Summoned vehicles will keep their current orientation.
