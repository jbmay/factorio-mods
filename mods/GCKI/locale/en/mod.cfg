[mod-name]
gcki-continued=Gizmos Car Keys (continued)

[mod-description]
gcki-continued=Tired of running to your vehicle? Then let it come to you!\nThis mod is based on "Gizmos Car Keys" by AoDGizmo. It should work with most modded vehicles (except trains and trains in disguise) -- not just cars.



####################################################################################
#      Please don't' translate rich-text tags ("[color=green]" etc., [/color])!    #
#              The settings will look weird if these tags are changed!             #
####################################################################################
[mod-setting-name]
GCKI-debug_in_game=Show debug messages in the game
GCKI-debug_in_log=Write debug messages to log file
;Added GCKI-flying-text (1.1.2)
GCKI-flying_text=Display messages as flying text
;Added GCKI-show_hints (1.1.2)
GCKI-show_hints=Show all hints
;Added GCKI-guiclaim_locked_vehicle (1.1.2)
GCKI-guiclaim_locked_vehicle=Show GUI to claim locked vehicle
;Added GCKI-autoclaim_locked_vehicle (1.1.2)
GCKI-autoclaim_locked_vehicle=Automatically claim locked vehicle
GCKI-long_reach=Enable long reach
; Changed for 1.1.2
GCKI-render_text=Show messages on the ground
GCKI-render_time=Duration of these messages
GCKI-render_color=Color of these messages
GCKI-teleport_to_other_surface=Teleport to other surfaces
GCKI-zahnfeechen_icons=Use icons from "Gizmos Car Keys - Zahnfeechen Patch"
; Added for 1.1.2
GCKI-change-force_player-keeps-vehicles=Defecting players keep their vehicles
; Added for 1.1.2
GCKI-change-force_eject=Eject alien players when a player defects
; Added for 1.1.6
GCKI-lose-vehicles-on-force-reset=Players lose vehicles on force reset
; Added for 1.1.6
GCKI-lose-vehicles-on-research-reverted=Players lose vehicles if unlock tech is unresearched
; Added for 1.1.11
GCKI-select_orientation_from=Summoned vehicles get orientation from


[mod-setting-description]
; Changed for 1.1.2
GCKI-debug_in_game=Only useful for debugging the game!
;Shortened for 1.1.2
GCKI-debug_in_log=If you've found a bug, please turn this on, try to reproduce the error, and include the log file (factorio-current.log) in your bug report!
;Added for 1.1.2
GCKI-flying_text=Display messages and optional hints as flying text centered on the player, not in the game chat.
;Added for 1.1.2
GCKI-show_hints=Allows you to toggle some messages that are not essential. This is meant to avoid spam when certain mods trigger the same event more often then necessary in rapid succession.
;Added GCKI-guiclaim_locked_vehicle (1.1.2)
GCKI-guiclaim_locked_vehicle=If the last vehicle you've owned has been destroyed or stolen, show the GUI so you can claim one of your locked vehicles.
;Added GCKI-autoclaim_locked_vehicle (1.1.2)
GCKI-autoclaim_locked_vehicle=If the last vehicle you've owned has been destroyed or stolen, and you have exactly one locked vehicle left, automatically claim it without showing the GUI.
;Shortened for 1.1.2
GCKI-long_reach=If you are using mods that extend your reach, check this option to be able to place your vehicle more than 10 tiles away.\nWARNING: This is quite cheaty if you have any mod that lets you reach very far!
;Shortened for 1.1.2
GCKI-render_text=Show a message on the ground if your vehicle has been stolen or destroyed.
;Shortened for 1.1.2
GCKI-render_time=Time in seconds\n(Allowed values: 1-3600; default: 300)
;Shortened for 1.1.2
GCKI-teleport_to_other_surface=If the vehicle you're in is summoned to another surface by its owner, you'll travel along. Turn this off to be ejected before teleportation!
;Changed for 1.1.2
GCKI-zahnfeechen_icons=Your keys look like they did in "Gizmos Car Keys - Zahnfeechen Patch". Just changes the icon.
;Added for 1.1.2
GCKI-change-force_player-keeps-vehicles=By default, players joining another force will bring along all vehicles they have claimed or locked. If unchecked, players leave their vehicles to their old force -- kindly unlocking them, if necessary.\n(Vehicles will also lose their custom name if the player abandons them.)
;Added for 1.1.2
GCKI-change-force_eject=When players join another force and take their vehicles with them, eject occupants belonging to the old force. Alternatively, players who abandon their vehicles on switching forces will be ejected from their ex-vehicle.
; Added for 1.1.6
GCKI-lose-vehicles-on-force-reset=If a force is reset, all players on that force will lose their vehicles for good (locked vehicles will be unlocked). If this setting is not active, players will get back their vehicles once the unlock has been researched again.
; Added for 1.1.6
GCKI-lose-vehicles-on-research-reverted=If a force has unresearched the (last) unlock tech, all players on that force will lose their vehicles (locked vehicles will be unlocked). If this setting is not active, players will get back their vehicles once the unlock has been researched again.
;Added for 1.1.11
GCKI-select_orientation_from=Use current vehicle orientation or orientation of your character for vehicles summoned with __CONTROL_LEFT_CLICK__? You can temporarily use the other option with __CONTROL_KEY_SHIFT__+__CONTROL_LEFT_CLICK__.

