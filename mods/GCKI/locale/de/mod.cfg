[mod-name]
gcki-continued=Gizmos Car Keys (continued)

[mod-description]
gcki-continued=Du hast keine Lust mehr, ständig zu deinem Fahrzeug zu laufen? Dann lasse es doch einfach zu dir kommen!\nDieser Mod basiert auf "Gizmos Car Keys" von AoDGizmo. Er sollte nicht nur mit Autos, sondern mit allen gemoddeten Fahrzeugen (außer Lokomotiven und Eisenbahnwagen) funktionieren.



[mod-setting-name]
GCKI-debug_in_game=Debug-Meldungen im Spiel anzeigen?
GCKI-debug_in_log=Debug-Meldungen ins Log schreiben?
; Added GCKI-flying-text (1.1.2)
GCKI-flying_text=Hinweise als schwebenden Text anzeigen?
GCKI-long_reach=Große Reichweite erlauben?
GCKI-render_text=Meldungen auf dem Boden einblenden?
GCKI-render_time=Wie lange sind diese Meldungen zu sehen?
GCKI-render_color=Welche Farbe sollen diese Meldungen haben?
GCKI-teleport_to_other_surface=Auf andere Oberflächen teleportieren?
; Added GCKI-guiclaim_locked_vehicle (1.1.2)
GCKI-guiclaim_locked_vehicle=Abgeschlossenes Fahrzeug in Besitz nehmen (GUI)
; Added GCKI-autoclaim_locked_vehicle (1.1.2)
GCKI-autoclaim_locked_vehicle=Automatisch abgeschlossenes Fahrzeug in Besitz nehmen
GCKI-show_hints=Alle Hinweise anzeigen?
GCKI-zahnfeechen_icons=Icons aus "Gizmos Car Keys - Zahnfeechen Patch" verwenden?
; Added GCKI-change-force_player-keeps-vehicles (1.1.2)
GCKI-change-force_player-keeps-vehicles=Spieler behalten Fahrzeuge bei Parteiwechsel
; Added GCKI-change-force_eject (1.1.2)
GCKI-change-force_eject=Eject alien players from vehicles when players defect
; Added for 1.1.6
GCKI-lose-vehicles-on-force-reset=Players lose vehicles on force reset
; Added for 1.1.6
GCKI-lose-vehicles-on-research-reverted=Players lose vehicles if unlock tech is unresearched
; Added for 1.1.11
#~ GCKI-select_orientation_from=Summoned vehicles get orientation from



[mod-setting-description]
;Changed for 1.1.2
GCKI-debug_in_game=Dies könnte bei der Fehlersuche helfen.
;Shortened for 1.1.2
GCKI-debug_in_log=Bitte aktiviere diese Option, wenn du einen Fehler gefunden hast, reproduziere den Fehler und schicke mir die Log-Datei (factorio-current.log)!
; Added for 1.1.2
GCKI-flying_text=Informationen und optionale Hinweise werden als schwebender Text angezeigt. Sie sind nur kurze Zeit zu sehen, füllen dafür aber nicht das Chat-Fenster.
; Added for 1.1.2
GCKI-show_hints=Einige Hinweise sind nützlich, aber nicht unbedingt erforderlich. Hier kannst du sie deaktivieren!
;Shortened for 1.1.2
GCKI-long_reach=Wenn du Mods nutzt, die deine Reichweite vergrößern, kannst du dein Fahrzeug an eine Stelle rufen, die mehr als 10 Felder von dir entfernt ist.
;Shortened for 1.1.2
GCKI-render_text=Zeigt eine Meldung auf dem Boden an, wenn dein Fahrzeug zerstört oder entwendet wurde.
;Shortened for 1.1.2
GCKI-render_time=Zeit in Sekunden\n(Erlaubte Werte: 1-3600; Standard: 300)
;Shortened for 1.1.2
GCKI-teleport_to_other_surface=Wenn das Fahrzeug, in dem du sitzt, auf eine andere Oberfläche teleportiert wird, reist du mit!
;Shortened for 1.1.2
GCKI-zahnfeechen_icons=Die Schlüssel sehen so aus wie in "Gizmos Car Keys - Zahnfeechen Patch", ansonsten ändert sich nichts!
; Added GCKI-guiclaim_locked_vehicle (1.1.2)
GCKI-guiclaim_locked_vehicle=Wenn dein Fahrzeug zerstört oder gestohlen wurde, wird eine Liste deiner abgeschlossenen Fahrzeuge angezeigt und du kannst eines davon in Besitz nehmen.
; Added GCKI-autoclaim_locked_vehicle (1.1.2)
GCKI-autoclaim_locked_vehicle=Wenn dein Fahrzeug zerstört oder gestohlen wurde und du nur noch ein abgeschlossenes Fahrzeug hast, nimmst du es automatisch in Besitz.
GCKI-change-force_player-keeps-vehicles=By default, players joining another force will take all vehicles they have claimed or locked with them. Alternatively, players may leave their vehicles to their old force -- kindly unlocking them, if necessary.
; Added GCKI-change-force_eject (1.1.2)
GCKI-change-force_eject=When players join another force and take their vehicles with them, occupants from the old force will be ejected immediately.
; Added for 1.1.6
GCKI-lose-vehicles-on-force-reset=If a force is reset, all players on that force will lose their vehicles for good (locked vehicles will be unlocked). If this setting is not active, players will get back their vehicles once the unlock has been researched again.
; Added for 1.1.6
GCKI-lose-vehicles-on-research-reverted=If a force has unresearched the (last) unlock tech, all players on that force will lose their vehicles (locked vehicles will be unlocked). If this setting is not active, players will get back their vehicles once the unlock has been researched again.
;Added for 1.1.11
