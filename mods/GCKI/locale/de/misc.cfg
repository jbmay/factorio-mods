#~ [item-description]
#~ GCKI_car-key=Klicke auf ein Fahrzeug, und es gehört dir! Wenn du dasselbe Fahrzeug noch einmal anklickst, verschließt oder öffnest du es. Willst du, dass es zu dir kommt, klicke mit den Schlüsseln auf eine Stelle in deiner Nähe!

#~ [entity-name]
#~ GCKI_car-key=Schlüssel

[shortcut-name]
GCKI_car-key-shortcut=Mit den Schlüsseln kannst du Fahrzeuge in Besitz nehmen, auf- und zuschließen, oder zu dir rufen.\n[color=yellow](Du musst eine Spielfigur haben, um die Schlüssel zu benutzen!)[/color]

[shortcut-description]
GCKI_car-key-shortcut=Mit den Schlüsseln kannst du Fahrzeuge in Besitz nehmen, auf- und zuschließen, oder zu dir rufen.\n[color=yellow](Du musst eine Spielfigur haben, um die Schlüssel zu benutzen!)[/color]


[controls]
keys-to-cursor=Schlüssel nehmen


[GCKI-translation]
text=__1__
flying_text=__1__
render_text=__1__

[GCKI-commands]
command=[color=yellow]Verwendung: /__1__ [on, off, toggle, status]\nÄndert die Einstellung __2__. Wenn kein Argument angegeben wurde, wird automatisch umgeschaltet ("toggle").\n(__3__)[/color]
command-help=[color=yellow]Verwendung: /__1__ [on, off, toggle, status]\nÄndert die Einstellung __2__. Wenn kein Argument angegeben wurde, wird automatisch umgeschaltet ("toggle").[/color]
command-toggled=[color=yellow]__1__ ist jetzt __2__.[/color]
command-status=[color=yellow]__1__ ist zur Zeit __2__.[/color]
command-unlock-help=[color=yellow]Verwendung: /__1__ [ID]\nSchließt das Fahrzeug mit der angegebenen ID auf, wenn du es abgeschlossen hast oder Administrator bist. Wenn keine ID angegeben wurde, schließt Du mit diesem Befehl ALLE Fahrzeuge auf, wenn du Administratorrechte hast. Ansonsten schließt du alle Fahrzeuge auf, die du selbst abgeschlossen hast.[/color]
command-unlock-player-help=[color=yellow]Usage: /__1__ [Index, Name]\nSchließt alle Fahrzeuge auf, die vom angegebenen Spieler abgeschlossen worden sind. Du musst Administratorrechte haben, um diesen Befehl zu verwenden.[/color]
command-reset-help=[color=yellow]Verwendung: /__1__ [ID]\nGibt das Fahrzeug mit der angegebenen ID frei, wenn es dir gehört, wenn du es abgeschlossen hast oder wenn du Administrator bist. Wenn keine ID angegeben wurde, gibst du mit diesem Befehl ALLE Fahrzeuge frei, wenn du Administratorrechte hast. Ansonsten gibst du alle Fahrzeuge frei, die dir gehören oder die du abgeschlossen hast.[/color]
command-reset-player-help=[color=yellow]Verwendung: /__1__ [Index, Name]\nGibt alle Fahrzeuge frei, wenn dem angegebenen Spieler gehören oder von ihm abgeschlossen wurden. Du musst Administratorrechte haben, um diesen Befehl zu verwenden.[/color]

# Debugging commands
command-GCKI-show-active-events-help=[color=yellow]Verwendung: /__1__ \nAuf welche Ereignisse reagiert GCKI gerade? Schreibt die Namen in den Chat und in die Logdatei.[/color]
GCKI-is-event-active=[color=yellow]Verwendung: /__1__ [Name, ID]\nMit diesem Befehl findest du heraus, ob GCKI gerade auf ein bestimmtes Ereignis ("event") reagiert. Das Ereignis kann entweder als Zeichenkette ohne Anführungszeichen (Name) oder als ganze Zahl (ID) angegeben werden.[/color]

[GCKI-command-errors]
error=[color=yellow][FEHLER] __1__[/color]
must-be-admin=Du brauchst Administratorrechte für diesen Befehl!
no-such-player=Spieler "__1__" gibt es nicht!
no-such-vehicle=Es gibt kein Fahrzeug mit unit_number __1__!
no-locked-or-owned-vehicles=Es gibt keine Fahrzeuge, die du aufschließen oder zurücksetzen könntest!
player-has-no-vehicles=Spieler "__1__" besitzt kein Fahrzeug und hat auch keines abgeschlossen!
#~ is-event-active-invalid-event=Es gibt kein Ereignis "__1__"!
#~ is-event-active-no-args=Du musst ein Ereignis angeben (Integer or Name ohne Anführungszeichen)!

#~ [GCKI-command-output]
#~ show-active-events=GCKI reagiert momentan auf folgende Ereignisse ("events"): __1__
#~ is-event-active-true=GCKI reagiert momentan auf das Ereignis "__1__" (__2__).
#~ is-event-active-false=GCKI reagiert momentan NICHT auf das Ereignis "__1__" (__2__).

[techeffect-description]
technology-effect=Fügt Schlüssel zur Aktionsleiste hinzu, mit denen du Fahrzeuge in Besitz nehmen, zu dir rufen, oder auf- und zuschließen kannst.
